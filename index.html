
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>B2B Order & Delivery</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      color: #17233b;
    }
    header {
      background: #172b4d;
      color: white;
      padding: 20px;
    }
    header h2 { margin: 0 0 6px; }
    header small { color: #cbd5e1; }
    main {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    .card {
      background: white;
      border: 1px solid #e0e5ed;
      border-radius: 12px;
      padding: 24px;
      text-align: left;
      cursor: pointer;
      font-size: 17px;
    }
    .card:hover { border-color: #2563eb; }
    .card span {
      display: block;
      margin-top: 10px;
      font-size: 13px;
      color: #64748b;
    }
    #content {
      margin-top: 24px;
      background: white;
      border-radius: 12px;
      padding: 24px;
      min-height: 100px;
    }
    button { font-family: inherit; }
  </style>
</head>
<body>
  <header>
    <h2>B2B Order & Delivery</h2>
    <small>Ex Factory | GST Extra | Freight To-Pay</small>
  </header>

  <main>
    <h2>Application Dashboard</h2>
    <div class="grid">
      <button class="card" onclick="openPage('Item Master')">
        Item Master
        <span>Products, cartons, weight and CBM</span>
      </button>
      <button class="card" onclick="openPage('Customer Master')">
        Customer Master
        <span>Dealers, GSTIN and PIN lookup</span>
      </button>
      <button class="card" onclick="openPage('Delivery Partners')">
        Delivery Partners
        <span>Transporters and To-Pay freight</span>
      </button>
      <button class="card" onclick="openPage('New Order')">
        New Order
        <span>Order discount, GST and delivery</span>
      </button>
      <button class="card" onclick="openPage('Received Orders')">
        Received Orders
        <span>Import and revision review</span>
      </button>
      <button class="card" onclick="openPage('Update Manager')">
        Update Manager
        <span>Software and master-data updates</span>
      </button>
    </div>
    <section id="content">
      <h3>Welcome</h3>
      <p>Select a module above.</p>
    </section>
  </main>

  <script>
    function openPage(name) {
      document.getElementById("content").innerHTML =
        "<h3>" + name + "</h3>" +
        "<p>Module selected. Detailed functionality " +
        "will be added in the next development stage.</p>";
    }
  </script>
</body>
</html>
